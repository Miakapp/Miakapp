<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" />
    <!-- Opening a home talks to the control plane and frames the app sandbox. -->
    <link rel="preconnect" href="%VITE_MIAKAPP_COMPONENT_POINTER_ENDPOINT%" crossorigin />
    <link rel="preconnect" href="%VITE_MIAKAPP_COMPONENT_SANDBOX_ORIGIN%" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Miakapp transforme votre maison en une interface vivante, façonnée par vous et votre agent."
    />
    <title>Miakapp</title>
    <!--
      The installed app starts at `/`, which is also the prerendered landing.
      Before the first paint, an app launch hides that page and shows the
      house shell's own background instead; the bundle then opens the
      remembered home (or the sign-in page) in its place.
    -->
    <style>
      html[data-miakapp-launch], html[data-miakapp-launch] body { background: #f3f0e8; }
      html[data-miakapp-launch="cover"] #root { visibility: hidden; }
      @media (prefers-color-scheme: dark) {
        html[data-miakapp-launch], html[data-miakapp-launch] body { background: #0a1024; }
      }
    </style>
    <script>
      (function () {
        try {
          var path = location.pathname;
          if (path !== '/' && path !== '/fr') return;
          if (!(matchMedia('(display-mode: standalone)').matches || navigator.standalone === true)) return;
          document.documentElement.setAttribute('data-miakapp-launch', 'cover');
        } catch (error) { /* the landing shows, as before */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
